name: deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVER: root@cloudservetechcentral.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.COURIER_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.COURIER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via /opt/courier/deploy.sh (git pull + build + systemd restart)
        run: ssh "$SERVER" "bash /opt/courier/deploy.sh && tail -5 /tmp/courier-deploy.log"

      - name: Verify deployment
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 15 https://courier.cloudservetechcentral.com/api/health >/dev/null; then
              echo "PUBLIC_HEALTH_OK"
              curl -sf --max-time 15 https://mail.cloudservetechcentral.com/api/health >/dev/null && echo "MAIL_HOST_OK"
              exit 0
            fi
            sleep 10
          done
          echo "PUBLIC_HEALTH_FAILED"; exit 1
