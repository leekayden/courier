name: deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SERVER: root@cloudservetechcentral.com
      REMOTE_DIR: /var/www/courier
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.COURIER_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.COURIER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync source to droplet
        run: |
          rsync -az --delete --info=stats1 \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='out' \
            --exclude='target' \
            --exclude='.env' \
            --exclude='docker-compose.prod.yml' \
            ./ "$SERVER:$REMOTE_DIR/"

      - name: Rebuild and restart container on droplet
        run: ssh "$SERVER" "cd $REMOTE_DIR && docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d && docker image prune -f >/dev/null"

      - name: Verify deployment
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 15 https://courier.cloudservetechcentral.com/api/health >/dev/null; then
              echo "PUBLIC_HEALTH_OK"; exit 0
            fi
            sleep 10
          done
          echo "PUBLIC_HEALTH_FAILED"; exit 1
